name: Staging delivery

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/staging-delivery.yml
      - scripts/review/check-staging.mjs

permissions:
  contents: read

jobs:
  delivery:
    name: Verify live UAT assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify deployed entry and asset hashes
        run: node scripts/review/check-staging.mjs
