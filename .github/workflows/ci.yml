name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch-policy:
    name: Branch policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Require develop for production releases
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [[ "$BASE_BRANCH" == "main" && ( "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ) ]]; then
            echo "Only develop may open a pull request to main. Retarget this pull request to develop."
            exit 1
          fi

  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix explorer

      - name: Run automated tests
        run: node --test tests/*.test.mjs

      - name: Validate Workshop inventory
        run: node scripts/play/validate-inventory.mjs

      - name: Type-check
        run: npm --prefix explorer run typecheck

      - name: Lint
        run: npm --prefix explorer run lint

      - name: Build production output
        run: npm --prefix explorer run build

      - name: Build Vercel production output for release PRs
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: npm --prefix explorer run build:vercel
