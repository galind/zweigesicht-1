name: Holder assets

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/holder-assets.yml
      - scripts/assets/**
      - assets/source-manifest/holder*.json
      - explorer/src/bench/BenchViewer.ts

permissions:
  contents: read

jobs:
  holders:
    name: Convert and verify holders
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Install pinned conversion and runtime dependencies
        run: |
          npm ci --prefix scripts/assets
          npm ci --prefix explorer
      - name: Convert, decode and compare exact geometry and transfer sizes
        run: node scripts/assets/prepare-holders.mjs
      - name: Retain only optimized GLBs and measurements
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optimized-holders
          path: |
            assets/generated/holders/*.glb
            assets/generated/holders/holder-runtime.json
          if-no-files-found: error
          retention-days: 14
