name: Verify release candidate

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full SHA of the develop commit reviewed in staging
        required: true
        type: string
      confirmation:
        description: Type "release" after checking staging and applicable release gates
        required: true
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify reviewed commit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Require a reviewed develop commit
        env:
          REVIEWED_COMMIT: ${{ inputs.commit }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/develop" || "$CONFIRMATION" != "release" || ! "$REVIEWED_COMMIT" =~ ^[0-9a-f]{40}$ || "$REVIEWED_COMMIT" != "$GITHUB_SHA" ]]; then
            echo "Run from develop, enter its reviewed full SHA, and confirm release."
            exit 1
          fi
      - name: Check out reviewed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix explorer
      - name: Run automated tests
        run: node --test tests/*.test.mjs
      - name: Validate Workshop inventory
        run: node scripts/play/validate-inventory.mjs
      - name: Type-check
        run: npm --prefix explorer run typecheck
      - name: Lint
        run: npm --prefix explorer run lint
      - name: Build production output
        run: npm --prefix explorer run build
      - name: Build Vercel production output
        run: npm --prefix explorer run build:vercel

      - name: Record candidate for a release pull request
        run: |
          {
            echo '## Verified release candidate'
            echo "Commit: $GITHUB_SHA"
            echo 'Open a develop → main pull request and review the exact head SHA before merging.'
            echo 'This workflow does not update main or publish a release.'
          } >> "$GITHUB_STEP_SUMMARY"
