name: Release to production

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Optional reviewed develop SHA; leave empty to release its current head
        required: false
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Release through protected PRs
    if: github.ref == 'refs/heads/main' && github.repository == 'galind/zweigesicht-1'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # This environment must allow only main, with the app key stored here.
    environment: release-automation
    steps:
      - name: Check out trusted release controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Require release app configuration
        env:
          APP_ID: ${{ vars.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$APP_ID" || -z "$APP_KEY" ]]; then
            echo 'Configure RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY in the main-only release-automation environment.'
            exit 1
          fi
      - name: Create repository-scoped release token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Release exact commit and synchronize develop
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const release = require('./.github/scripts/release.cjs');
            await release({ github, context, core });
