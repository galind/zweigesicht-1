name: Workshop
on:
  pull_request:
    branches: [develop]
    paths:
      - .github/workflows/workshop.yml
      - explorer/src/assembly/**
      - explorer/app/workshop/**
      - explorer/src/viewer/StudioFrame.ts
      - scripts/review/workshop.mjs
      - tests/workshop.test.mjs
      - explorer/src/content/seo.ts
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workshop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: explorer/package-lock.json
      - name: Install application and runner browser
        run: |
          npm ci --prefix explorer
          npm install --prefix "$RUNNER_TEMP/workshop-browser" --no-save --package-lock=false playwright@1.56.1
          "$RUNNER_TEMP/workshop-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify menu placement on desktop and emulated phones
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/workshop-browser/node_modules/playwright/index.mjs
        run: node scripts/review/workshop.mjs
